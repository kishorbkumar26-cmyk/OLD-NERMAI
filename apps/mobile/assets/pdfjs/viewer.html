<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PDF Viewer</title>
  <script src="./pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #060913; /* Dark mode bg */
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .page-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
      position: relative;
    }
    canvas {
      max-width: 100%;
      height: auto !important;
    }
    #loading {
      color: #D4AF37; /* Gold */
      font-family: sans-serif;
      margin-top: 50vh;
      transform: translateY(-50%);
    }
    
    /* Animated Watermark styling */
    .watermark-card {
      position: fixed;
      top: 0; left: 0;
      pointer-events: auto; /* Capture touch/mouse for dodging */
      background-color: rgba(255, 255, 255, 0.85);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      border: 1px solid rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: transform 0.1s linear;
      z-index: 9999;
      user-select: none;
      -webkit-user-select: none;
    }
    .watermark-card-title {
      font-size: 14px; font-weight: bold; color: #000; margin-bottom: 4px; font-family: sans-serif;
    }
    .watermark-card-sub {
      font-size: 11px; color: #333; text-align: center; white-space: pre-wrap; font-family: sans-serif; line-height: 1.3;
    }
  </style>
</head>
<body>
  <div id="loading">Loading PDF...</div>
  <div id="pdf-container"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

    let pdfDoc = null;
    let observer = null;
    
    // Animation state for the watermark card
    const animState = {
      x: 50, y: 50, dx: 1.5, dy: 1.5,
      width: 200, height: 80,
      active: false,
      el: null
    };

    function initWatermark(watermarkData) {
      if (animState.el) return; // already initialized
      
      const card = document.createElement('div');
      card.className = 'watermark-card';
      
      const title = document.createElement('span');
      title.className = 'watermark-card-title';
      title.innerText = watermarkData.text || 'NERMAI ACADEMY';
      
      const sub = document.createElement('span');
      sub.className = 'watermark-card-sub';
      sub.innerText = watermarkData.subtext || '';
      
      card.appendChild(title);
      card.appendChild(sub);
      
      document.body.appendChild(card);
      animState.el = card;
      animState.active = true;
      
      // Setup dodge on hover/touch
      const dodge = () => {
        const maxX = Math.max(0, window.innerWidth - card.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - card.offsetHeight);
        
        let newX = animState.x;
        let newY = animState.y;
        while (Math.abs(newX - animState.x) < maxX * 0.25 || Math.abs(newY - animState.y) < maxY * 0.25) {
          newX = Math.random() * maxX;
          newY = Math.random() * maxY;
        }
        animState.x = newX;
        animState.y = newY;
        animState.dx = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random());
        animState.dy = (Math.random() > 0.5 ? 1 : -1) * (1.5 + Math.random());
      };
      
      card.addEventListener('mouseenter', dodge);
      card.addEventListener('touchstart', (e) => {
         e.preventDefault();
         dodge();
      });
      
      // Animation loop
      function animate() {
        if (!animState.active) return;
        
        const w = window.innerWidth;
        const h = window.innerHeight;
        const cw = card.offsetWidth || 200;
        const ch = card.offsetHeight || 80;
        
        animState.x += animState.dx;
        animState.y += animState.dy;
        
        if (animState.x <= 0) {
          animState.x = 0;
          animState.dx *= -1;
        } else if (animState.x + cw >= w) {
          animState.x = w - cw;
          animState.dx *= -1;
        }
        
        if (animState.y <= 0) {
          animState.y = 0;
          animState.dy *= -1;
        } else if (animState.y + ch >= h) {
          animState.y = h - ch;
          animState.dy *= -1;
        }
        
        card.style.transform = `translate(${animState.x}px, ${animState.y}px)`;
        requestAnimationFrame(animate);
      }
      
      requestAnimationFrame(animate);
    }

    function initObserver() {
      const options = {
        root: null,
        rootMargin: '0px',
        threshold: 0.5
      };
      
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const pageNum = entry.target.getAttribute('data-page-number');
            if (window.ReactNativeWebView) {
               window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'PAGE_CHANGED', page: parseInt(pageNum) }));
            }
          }
        });
      }, options);
    }

    // Process messages from React Native
    document.addEventListener("message", function(event) {
      try {
        const msg = JSON.parse(event.data);
        
        if (msg.type === 'LOAD_DOCUMENT') {
          const base64Data = msg.data;
          const config = msg.config || {};
          
          if (config.watermark) {
             initWatermark(config.watermark);
          }
          
          loadPDF(base64Data, config.startPage || 1);
        } else if (msg.type === 'LOAD_DOCUMENT_URL') {
          const url = msg.url;
          const config = msg.config || {};
          
          if (config.watermark) {
             initWatermark(config.watermark);
          }
          
          loadPDFUrl(url, config.startPage || 1);
        } else if (msg.type === 'JUMP_TO_PAGE') {
          const targetPage = msg.page;
          const pageEl = document.getElementById(`page-${targetPage}`);
          if (pageEl) {
            pageEl.scrollIntoView({ behavior: 'smooth' });
          }
        }

      } catch (err) {}
    });
    
    // Polyfill for iOS which uses window.addEventListener instead of document
    window.addEventListener("message", function(event) {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'LOAD_DOCUMENT') {
          if (msg.config && msg.config.watermark) initWatermark(msg.config.watermark);
          loadPDF(msg.data, (msg.config || {}).startPage || 1);
        } else if (msg.type === 'LOAD_DOCUMENT_URL') {
          if (msg.config && msg.config.watermark) initWatermark(msg.config.watermark);
          loadPDFUrl(msg.url, (msg.config || {}).startPage || 1);
        }
      } catch (e) {}
    });

    function renderPDF(pdf, startPage) {
      pdfDoc = pdf;
      const loadingEl = document.getElementById('loading');
      loadingEl.style.display = 'none';
      
      const container = document.getElementById('pdf-container');
      initObserver();

      let pagesRendered = 0;
      
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(function(page) {
          const scale = 1.5; 
          const viewport = page.getViewport({ scale: scale });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page-container';
          pageDiv.id = `page-${pageNum}`;
          pageDiv.setAttribute('data-page-number', pageNum);
          
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);
          observer.observe(pageDiv);

          const renderContext = { canvasContext: context, viewport: viewport };
          page.render(renderContext).promise.then(() => {
             pagesRendered++;
             // Once all pages are rendered, notify RN and scroll to start page
             if (pagesRendered === pdf.numPages) {
                if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'LOADED', pages: pdf.numPages }));
                if (startPage > 1) {
                   setTimeout(() => {
                      const targetEl = document.getElementById(`page-${startPage}`);
                      if(targetEl) targetEl.scrollIntoView();
                   }, 500);
                }
             }
          });
        });
      }
    }

    function loadPDF(base64Data, startPage) {
      const loadingEl = document.getElementById('loading');
      loadingEl.innerText = 'Rendering PDF...';

      const raw = atob(base64Data);
      const uint8Array = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) {
        uint8Array[i] = raw.charCodeAt(i);
      }

      pdfjsLib.getDocument({data: uint8Array}).promise.then(function(pdf) {
        renderPDF(pdf, startPage);
      }).catch(function(reason) {
         loadingEl.innerText = 'Error: ' + reason;
         if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ERROR', error: reason.toString() }));
      });
    }

    function loadPDFUrl(url, startPage) {
      const loadingEl = document.getElementById('loading');
      loadingEl.innerText = 'Streaming PDF securely...';

      pdfjsLib.getDocument({ url: url }).promise.then(function(pdf) {
        renderPDF(pdf, startPage);
      }).catch(function(reason) {
         loadingEl.innerText = 'Error: ' + reason;
         if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'ERROR', error: reason.toString() }));
      });
    }

    function signalReady() {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'READY' }));
      } else {
        setTimeout(signalReady, 50);
      }
    }

    window.onload = function() {
       signalReady();
    };
  </script>
</body>
</html>
